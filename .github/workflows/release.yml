name: Release

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Stable release (main only) ──────────────────────────────────
  stable:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    env:
      # Prefer a maintainer-owned token, matching vitus-labs/tools. The
      # Version PR that changesets opens is authored by whoever owns this
      # token; with the bare GITHUB_TOKEN that is github-actions[bot], and
      # GitHub suppresses workflow events raised by that token — so the
      # Version PR lands with no CI runs and needs a manual close+reopen.
      #
      # RELEASE_TOKEN should be a fine-grained PAT with Contents:
      # read+write and Pull requests: read+write on this repo.
      #
      # Falling back to GITHUB_TOKEN keeps the release working without the
      # secret; it just reintroduces the empty-checks behaviour.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # `bun install` runs the root `prepare` script which sets
      # core.hooksPath to .githooks — that hook chains lint+typecheck
      # before every `git push`. In CI it fires when `changesets/action`
      # pushes the Version PR commit / publish tags, which made the
      # action spend minutes re-running typecheck and eventually SIGTERM
      # itself (observed on the 2.2.1 publish — npm publish succeeded but
      # the GitHub Release step was killed before it could run).
      #
      # The workflow already validates lint/build/typecheck/test in
      # explicit steps below, so suppressing the hook here removes pure
      # redundancy — not safety.
      - name: Disable local git hooks for the publish flow
        run: git config core.hooksPath /dev/null

      - name: Lint & Format
        run: bun run lint

      - name: Build all packages
        run: bun run pkgs:build

      - name: Type Check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # v2 no longer reads the `GITHUB_TOKEN` env var or the
          # credentials `actions/checkout` configured — the token must be
          # passed explicitly through this input.
          github-token: ${{ env.RELEASE_TOKEN }}
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # Disable the built-in per-package GitHub Releases — the
          # "Create umbrella GitHub Release" step below ships a single
          # `vX.Y.Z` release for the fixed-group suite instead. Without
          # this, the action ALSO creates 15 per-package releases (it
          # defaults to true when `publish-script` is set), cluttering the
          # releases page and re-triggering the per-package iteration that
          # was observed hanging mid-run on the 2.2.0 release.
          create-github-releases: false
          # v2 split git tags out of `create-github-releases`: turning the
          # releases off no longer suppresses the 15 per-package git tags,
          # they now default to on. Keep them off — the umbrella step below
          # pushes the single `vX.Y.Z` tag this repo actually releases from.
          push-git-tags: false
        env:
          # Emit npm provenance attestations — the job already grants
          # `id-token: write` for OIDC trusted publishing; this makes npm
          # actually attach the attestation to every published package.
          NPM_CONFIG_PROVENANCE: 'true'

      # The changesets/action's built-in `create-github-releases: true`
      # iterates per-package and was observed hanging mid-run on the 2.2.0
      # release after npm publish had already succeeded. Replaced with a
      # single umbrella Release for the suite — matches how other fixed-
      # group monorepos (React, Apollo, Babel) ship.
      - name: Create umbrella GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          # Same identity as the push above, so the tag and the Release are
          # attributed consistently and a tag-triggered workflow (none today,
          # but the footgun is the same) would actually fire.
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
          # Injection-safe convention: pass step output through env rather
          # than interpolating `${{ }}` directly into the script body. The
          # content is repo-derived (package names/versions), but env vars
          # can't break shell quoting the way inline interpolation can.
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="v${VERSION}"

          # Idempotent tag: skip if it already exists (e.g. retried run).
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::Tag ${TAG} already exists — skipping tag step."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          # Build a markdown list of every published package@version from
          # the action's structured output.
          PACKAGES=$(printf '%s' "$PUBLISHED_PACKAGES" \
            | jq -r '[.[] | "- `\(.name)@\(.version)`"] | join("\n")')

          BODY=$(cat <<EOF
          All packages in the \`@vitus-labs/*\` suite at **${VERSION}**.

          ## Published

          ${PACKAGES}

          ## Per-package detail

          See each \`packages/*/CHANGELOG.md\` for the package-specific entry generated from the changesets that bumped it.
          EOF
          )

          # Create the Release. `--verify-tag` ensures we point at a real
          # ref. Idempotent via `|| true` if a Release already exists for
          # this tag (manual retry scenario).
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes "${BODY}" \
            --verify-tag \
            || echo "::warning::Release for ${TAG} already exists — skipping creation."

  # ── Prerelease (feature/release branches) ───────────────────────
  prerelease:
    if: github.ref != 'refs/heads/main'
    name: Publish Prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Same reason as the stable job — the local pre-push hook would
      # re-run typecheck on every push by `changeset publish` and could
      # cancel the action mid-publish.
      - name: Disable local git hooks for the publish flow
        run: git config core.hooksPath /dev/null

      - name: Build all packages
        run: bun run pkgs:build

      - name: Publish snapshot
        env:
          # Same provenance attestation as the stable job — id-token: write
          # is granted workflow-wide.
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          bunx changeset version --snapshot alpha
          # See scripts/rewrite-workspace-peers.mjs — npm publish doesn't
          # rewrite `workspace:` in peerDependencies, only in dependencies.
          # We do it ourselves so the published artifact has valid semver.
          node scripts/rewrite-workspace-peers.mjs
          bunx changeset publish --tag next
