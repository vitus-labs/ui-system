name: Ratchet coverage

# Weekly scheduled job that locks in coverage improvements: if the
# current coverage on main exceeds the thresholds in vitest.config.ts
# by more than 0.05 points on any metric, raise the threshold to the
# new floor and open a bot PR for human review.
#
# Why open a PR (not commit directly): branch protection on main
# requires status checks + review-style verification on every change.
# Direct bot commits also feel intrusive; a PR is auditable and lets
# reviewers reject a change that was technically correct but came at
# a cost (e.g. coverage went up because a flaky test now always passes
# — better to investigate than lock in).
#
# Runs Mondays 09:00 UTC. Manual trigger via workflow_dispatch.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ratchet-coverage
  cancel-in-progress: false

jobs:
  ratchet:
    name: Ratchet coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Same token ladder as release.yml. This is load-bearing, not
      # cosmetic: a branch pushed with the bare GITHUB_TOKEN does not
      # trigger workflows (GitHub suppresses events raised by that token to
      # prevent recursion), so the ratchet PR lands with NO status checks
      # and branch protection blocks it forever. That is exactly what
      # happened — nine identical ratchet PRs accumulated between
      # 2026-06-29 and 2026-08-24, every one unmergeable, because none of
      # them could ever get a green check. An App or PAT token is owned by
      # a real identity, so its pushes raise events normally and CI runs.
      - name: Mint GitHub App token
        id: app_token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Resolve token
        id: token
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PAT_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "source=github-app" >> "$GITHUB_OUTPUT"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "::notice::Ratchet auth: GitHub App — checks will fire on the ratchet PR."
          elif [ -n "$PAT_TOKEN" ]; then
            echo "source=pat" >> "$GITHUB_OUTPUT"
            echo "token=$PAT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "::notice::Ratchet auth: RELEASE_PAT — checks will fire on the ratchet PR."
          else
            echo "source=github-token" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "::warning title=Ratchet PR will have empty checks::No RELEASE_APP_ID/RELEASE_PAT configured — falling back to GITHUB_TOKEN. The ratchet PR will land with no CI runs and branch protection will block it. See CONTRIBUTING.md → Releases → Setup."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need a full ref so we can push a new branch.
          token: ${{ steps.token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run pkgs:build

      - name: Run tests with coverage
        run: bun run test -- --coverage

      - name: Ratchet thresholds
        id: ratchet
        run: |
          # exit 0 = updated, 2 = no update needed, 1 = error
          set +e
          bun scripts/ratchet-coverage.ts
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "ratchet script errored"
            exit 1
          fi
          echo "updated=$( [ "$code" -eq 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Open PR if thresholds were raised
        if: steps.ratchet.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          COMMIT_MSG: |
            chore: ratchet coverage thresholds

            Auto-generated by the weekly ratchet job. Coverage on main
            exceeds the previous thresholds in vitest.config.ts by more
            than the 0.05-point margin — raising the floor to lock in
            the improvement.

            Review the diff against coverage/coverage-summary.json and
            merge if the gain is genuine (vs flaky-test-suddenly-passing).
          PR_BODY: |
            ## Summary

            Weekly ratchet from `.github/workflows/ratchet.yml`. Coverage on `main` improved past the thresholds in `vitest.config.ts` — this PR raises the floor to lock the gain in.

            ## Review checklist

            - [ ] Is the coverage improvement genuine? Compare against `coverage/coverage-summary.json` produced in this CI run.
            - [ ] Was a test added (good) or did a previously-flaky test happen to pass (bad — don't ratchet)?
            - [ ] Are the new thresholds within plausible noise of the actual numbers (1-2 points headroom)?

            If something looks off, close this PR — the next ratchet run will retry next Monday.

            Generated by `scripts/ratchet-coverage.ts`.
        run: |
          set -e
          BRANCH="chore/ratchet-coverage-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add vitest.config.ts
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"
          # Close any older ratchet PRs first. They propose the same
          # thresholds against an older baseline and conflict with each
          # other on vitest.config.ts, so keeping more than one open has no
          # value — the nine that accumulated were all byte-identical.
          for n in $(gh pr list --state open --search "chore: ratchet coverage thresholds in:title" --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch \
              --comment "Superseded by a newer ratchet run." || true
          done

          gh pr create \
            --title "chore: ratchet coverage thresholds" \
            --body "$PR_BODY"
